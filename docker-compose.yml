services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456qwerty
      POSTGRES_DB: sport
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sport"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build:
      context: .
      target: tools
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:123456qwerty@db:5432/sport
      NEXTAUTH_URL: http://localhost:3010
      NEXTAUTH_SECRET: your-secret-key-change-in-production
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:init"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      DATABASE_URL: postgresql://postgres:123456qwerty@db:5432/sport
      NEXTAUTH_URL: http://localhost:3010
      NEXTAUTH_SECRET: your-secret-key-change-in-production
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      NODE_ENV: production
      PORT: 3010
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
